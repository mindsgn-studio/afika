appId: mindsgn.studio.pockt
---
- launchApp
- assertVisible:
    id: "portfolio-screen"
- tapOn:
    id: "send-tray-trigger"
- assertVisible:
    id: "send-recipient-input"

# An invalid recipient keeps the user on the recipient step.
- tapOn:
    id: "send-recipient-input"
- inputText: "not-an-address"
- tapOn:
    id: "send-recipient-next"
- assertVisible:
    id: "send-recipient-input"

# A valid address advances to the amount keypad.
- eraseText
- inputText: "0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045"
- tapOn:
    id: "send-recipient-next"
- assertVisible:
    id: "amount-keypad"
- assertVisible:
    id: "account-selector"

# Switching currency re-seeds the keypad with the other currency's symbol.
- tapOn:
    id: "send-currency-ZAR"
- assertVisible: ".*R0\\.00.*"
- tapOn:
    id: "send-currency-USDC"
- assertVisible: ".*\\$0\\.00.*"

# Amounts above the available balance are rejected in place, so branching on
# whether $1.00 was accepted covers both a funded and an empty wallet.
- tapOn:
    id: "key-1"

# Funded: the key is accepted, the decimal and backspace keys work, and the
# keypad's CTA reaches the review step. Live submission still requires
# E2E_LIVE=1 and a funded wallet.
- runFlow:
    when:
      visible: ".*\\$1\\.00.*"
    commands:
      - tapOn:
          id: "key-\\."
      - assertVisible: ".*\\$1\\.00.*"
      - tapOn:
          id: "key-backspace"
      - assertVisible: ".*\\$1\\.00.*"
      - tapOn:
          id: "create-button"
      - assertVisible:
          id: "send-review"

# Empty wallet: the key is rejected, the display stays at zero, and Review
# never enables.
- runFlow:
    when:
      notVisible: ".*\\$1\\.00.*"
    commands:
      - assertVisible: ".*\\$0\\.00.*"
      - assertVisible:
          id: "create-button"
          enabled: false
